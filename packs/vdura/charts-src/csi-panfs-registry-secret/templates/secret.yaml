{{- if .Values.create }}
{{- $server := required "registry.server is required when create is true" .Values.registry.server }}
{{- $user := required "registry.username is required when create is true" .Values.registry.username }}
{{- $pass := required "registry.password is required when create is true" .Values.registry.password }}
{{- $entry := dict "username" $user "password" $pass "auth" (printf "%s:%s" $user $pass | b64enc) }}
{{- with .Values.registry.email }}
{{- $_ := set $entry "email" . }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ required "name is required" .Values.name }}
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service }}
    app.kubernetes.io/part-of: vdura-panfs-csi
    product: com.vdura.csi.panfs
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ dict "auths" (dict $server $entry) | toJson | b64enc }}
{{- end }}
